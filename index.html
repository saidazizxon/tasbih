<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Tasbih Counter</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 2.2em;
      margin-bottom: 20px;
      color: #2c3e50;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }
    #count {
      font-size: 5em;
      margin: 20px 0;
      color: #34495e;
      font-weight: bold;
    }
    #reset {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(145deg, #e74c3c, #ff7675);
      color: white;
      font-size: 1em;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    #clickBtn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      font-size: 1.8em;
      font-weight: bold;
      color: white;
      cursor: pointer;
      background: radial-gradient(circle at top left, #27ae60, #2ecc71);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #clickBtn:hover {
      transform: scale(1.07);
      box-shadow: 0 14px 30px rgba(0,0,0,0.5);
    }
    #clickBtn:active {
      transform: scale(0.95);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <button id="reset" onclick="resetCounter()">Reset</button>
  <h1>Tasbih Counter</h1>
  <div id="count">0</div>
  <button id="clickBtn" onclick="increment()">Click</button>

  <script>
    let count = parseInt(localStorage.getItem("Tasbih")) || 0;
    const countDisplay = document.getElementById("count");
    countDisplay.textContent = count;

    function increment() {
      count++;
      countDisplay.textContent = count;
      localStorage.setItem("Tasbih", count);
    }

    function resetCounter() {
      count = 0;
      countDisplay.textContent = count;
      localStorage.setItem("Tasbih", count);
    }
  </script>
</body>
</html>
